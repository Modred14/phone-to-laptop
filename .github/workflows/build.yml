# .github/workflows/build.yml
name: Build and release

# Two ways to get new apps:
#  1. Push code to main      -> the "OfflineDrop (latest)" release is refreshed.
#  2. Publish a version tag  -> the apps are attached to that numbered release
#                               (for example v1.0.4).
# You can also start it by hand from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build app
        run: pyinstaller --onefile --name OfflineDrop server.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/OfflineDrop.exe OfflineDrop-Windows.exe

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip ../OfflineDrop-Mac.zip OfflineDrop

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            OfflineDrop-Windows.exe
            OfflineDrop-Mac.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # A version tag such as v1.0.4: attach the apps to that numbered release.
            TAG="$GITHUB_REF_NAME"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "OfflineDrop $TAG" \
                --generate-notes
            fi
          else
            # A push to main: replace the rolling "latest" release.
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create latest dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "OfflineDrop (latest)" \
              --notes "Automatically built from the newest code (commit ${GITHUB_SHA::7}). Download the file for your computer below and see the README for how to use it."
          fi