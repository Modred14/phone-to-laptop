# .github/workflows/build.yml
name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build app
        run: pyinstaller --onefile --name OfflineDrop server.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/OfflineDrop.exe OfflineDrop-Windows.exe

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip ../OfflineDrop-Mac.zip OfflineDrop

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OfflineDrop-Windows.exe
            OfflineDrop-Mac.zip